name: Identify3D
description: Identify3D developed software to secure the digital (additive / 3D-printing)
  manufacturing supply chain by encrypting, distributing, and tracing digital part
  files, so that a part could only be produced by an authorized user, machine, and
  material and non-conforming or counterfeit parts could not enter the physical supply
  chain. The suite coupled part designs with production criteria (designated user,
  machine, material) and provided intellectual-property protection, digital-rights
  management, and traceability for distributed manufacturing. Founded in San Francisco
  and backed by Uncork Capital, Identify3D was acquired by Materialise NV in October
  2021 and its technology was folded into the Materialise CO-AM distributed-manufacturing
  platform. The company no longer operates a standalone product, developer portal,
  or public API; this profile is retained in the API Evangelist network for historical
  and VC portfolio-graph purposes.
